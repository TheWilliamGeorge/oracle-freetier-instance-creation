name: Create OCI Instance

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  launch-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create OCI Config and Private Key files
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
          echo "${{ secrets.OCI_API_PRIVATE_KEY }}" | base64 -d > ~/.oci/oci_api_private_key.pem
          echo "${{ secrets.OCI_ENV }}" > oci.env
          chmod 600 ~/.oci/oci_api_private_key.pem

      - name: Run creation script
        run: python main.py
