name: Create OCI Instance

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  launch-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build OCI Config and Environment Files
        env:
          RAW_CONFIG: ${{ secrets.OCI_CONFIG }}
          RAW_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          RAW_ENV: ${{ secrets.OCI_ENV }}
        run: |
          mkdir -p ~/.oci
          python3 -c "
          import os

          config_str = os.environ.get('RAW_CONFIG', '').strip()
          raw_key = os.environ.get('RAW_KEY', '').strip()

          # Format key with leading spaces for ini multiline support
          indented_key = '\n'.join('  ' + line for line in raw_key.splitlines())

          # Construct config with inline key_content
          final_config = f'{config_str}\nkey_content =\n{indented_key}\n'

          with open('/home/runner/.oci/config', 'w') as f:
              f.write(final_config)
          with open('oci_config', 'w') as f:
              f.write(final_config)
          "
          echo "$RAW_ENV" > oci.env

      - name: Run creation script
        run: python main.py
